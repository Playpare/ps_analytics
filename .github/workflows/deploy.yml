name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit — useful
  # after rotating an endpoint secret, since the URLs are baked in at build
  # time and a secret change alone does not rebuild anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` because a half
# finished Pages deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fail if a build variable is unset
        # BEFORE the build, because after it there is nothing left to look at:
        # Vite inlines an unset variable as `undefined` and the bundle is a
        # perfectly valid file that cannot talk to anything.
        #
        # This exists because the check that ran after the build only grepped
        # for /exec URLs. VITE_API_GAME_KEY is not a URL, so when that secret
        # was missing the gate passed, the deploy went out, and the dashboard
        # answered "Unauthorized" on every request of its own while the
        # reports - which use a different call and no key - carried on working.
        # A gate that only knows one shape of value is not a gate.
        env:
          VITE_API_AUTH: ${{ secrets.VITE_API_AUTH }}
          VITE_API_UA: ${{ secrets.VITE_API_UA }}
          VITE_API_WEEKLY: ${{ secrets.VITE_API_WEEKLY }}
          VITE_API_TILLDATE: ${{ secrets.VITE_API_TILLDATE }}
          VITE_API_ASO: ${{ secrets.VITE_API_ASO }}
          VITE_API_NEGATIVE: ${{ secrets.VITE_API_NEGATIVE }}
          VITE_API_GAME: ${{ secrets.VITE_API_GAME }}
          VITE_API_GAME_KEY: ${{ secrets.VITE_API_GAME_KEY }}
        run: |
          missing=""
          for v in VITE_API_AUTH VITE_API_UA VITE_API_WEEKLY VITE_API_TILLDATE \
                   VITE_API_ASO VITE_API_NEGATIVE VITE_API_GAME VITE_API_GAME_KEY; do
            eval "val=\${$v}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are not set:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "all 8 build variables are set"

      - name: Build
        env:
          # The Apps Script /exec URLs. Set these under
          # Settings → Secrets and variables → Actions → Repository secrets.
          # A missing one fails the build below rather than shipping a
          # dashboard that cannot reach its data.
          VITE_API_AUTH: ${{ secrets.VITE_API_AUTH }}
          VITE_API_UA: ${{ secrets.VITE_API_UA }}
          VITE_API_WEEKLY: ${{ secrets.VITE_API_WEEKLY }}
          VITE_API_TILLDATE: ${{ secrets.VITE_API_TILLDATE }}
          VITE_API_ASO: ${{ secrets.VITE_API_ASO }}
          VITE_API_NEGATIVE: ${{ secrets.VITE_API_NEGATIVE }}
          VITE_API_GAME: ${{ secrets.VITE_API_GAME }}
          # Not a URL, so the endpoint check below does not cover it: the shared
          # key game-analytics puts on every request. Kept out of the repo for
          # the same reason the URLs are, and not a security control — see the
          # comment on GAME_API_KEY in src/shared/config.js.
          VITE_API_GAME_KEY: ${{ secrets.VITE_API_GAME_KEY }}
          # Relative base keeps the build correct whether Pages serves this at
          # a domain root or under /<repo>/.
          VITE_BASE: ./
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Fail if any endpoint is missing
        # config.js checks this in the browser too, but a build that silently
        # ships `undefined` as an endpoint is a broken deploy nobody notices
        # until someone opens the dashboard. Catch it here instead.
        #
        # Scans every emitted chunk rather than hub-*.js alone. Which chunk
        # holds config.js is Rollup's decision, not ours: it inlined it into
        # the hub bundle while six pages imported it, and split it into a
        # shared chunk the moment a seventh did. Pinning the check to one
        # filename meant a correct build with every secret set would have been
        # rejected here, reporting missing secrets - the one explanation that
        # was not the problem.
        run: |
          hits=$(grep -l 'script.google.com/macros' dist/assets/*.js 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "endpoints present in:"
            echo "$hits" | sed 's/^/  /'
            exit 0
          fi
          echo "::error::No Apps Script endpoints in any built chunk."
          echo "Check that the VITE_API_* repository secrets are set."
          exit 1

      # Pages serves from a Jekyll pipeline by default, which ignores paths
      # beginning with an underscore. Vite does not emit any today, but this
      # costs nothing and removes a class of confusing 404.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
