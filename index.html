<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSS3D Monetization Hub</title>
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Quicksand:wght@500;600;700&family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap">
  <!--THEME_BOOT-->
</head>
<body>

  <div id="authGate">
    <div id="authBox">
      <h1>Sign in</h1>
      <p class="sub">Playspare &middot; MSS3D</p>
      <label for="authUser">Username</label>
      <input id="authUser" type="text" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="authPass">Password</label>
      <input id="authPass" type="password" autocomplete="current-password">
      <button id="authBtn" type="button">Sign in</button>
      <div id="authMsg" role="status" aria-live="polite"></div>
    </div>
  </div>

  <main class="hub">
    <nav class="hub-nav" aria-label="Report period">
      <div class="brand">playspare <span>&middot; MSS3D Monetization Hub</span></div>
      <div id="hubNote" role="status" aria-live="polite">
        <span id="hubNoteText"></span>
        <button type="button" id="hubNoteAction">Sign in again</button>
      </div>
      <div class="report-nav">
        <button type="button" class="active" data-report="ua" aria-selected="true">UA</button>
        <button type="button" data-report="till-date" aria-selected="false">Till Date</button>
        <button type="button" data-report="weekly" aria-selected="false">Weekly</button>
        <button type="button" data-report="aso" aria-selected="false">ASO</button>
      </div>
      <button type="button" id="themeBtn">&#9728; Light</button>
      <button type="button" id="authOut">Sign out</button>
    </nav>

    <section class="reports">
      <div id="framePlaceholder"><span id="framePlaceholderText">Opening report&hellip;</span></div>
      <!-- data-src, not src: a report document is only fetched when its tab is
           first opened. hub.js appends the build stamp and the ?api= endpoint. -->
      <iframe
        class="report-frame"
        id="report-till-date"
        data-src="./reports/till-date/"
        title="Monetization report till date"></iframe>
      <iframe
        class="report-frame"
        id="report-weekly"
        data-src="./reports/weekly/"
        title="Weekly monetization report"
        hidden></iframe>
      <iframe
        class="report-frame"
        id="report-ua"
        data-src="./reports/ua/"
        title="User acquisition report"
        hidden></iframe>
      <iframe
        class="report-frame"
        id="report-aso"
        data-src="./reports/aso/"
        title="App store optimisation report"
        hidden></iframe>
    </section>
  </main>

  
  <script type="module" src="./main.js"></script>
</body>
</html>
